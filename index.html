<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leeuwarden Canlı Otobüs Saatleri</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden">
        
        <!-- Header -->
        <div class="p-6 border-b border-slate-700 bg-slate-800/50">
            <h1 class="text-2xl font-bold text-white tracking-tight">Durak Takibi</h1>
            <p class="text-sm text-slate-400 mt-1">Leeuwarden canlı kalkış saatleri</p>
            
            <!-- Durak Kodu Giriş Alanı -->
            <div class="mt-4 space-y-2">
                <div class="flex gap-2">
                    <input type="text" id="stopCodeInput" placeholder="Durak Kodu (örn: 21000010)" 
                        class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm">
                    <button onclick="verileriGetir()" 
                        class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-medium transition-colors text-sm">
                        Getir
                    </button>
                </div>

                <!-- Hızlı Test Butonu -->
                <div class="flex items-center justify-between pt-1">
                    <span class="text-xs text-slate-400">Denemek için:</span>
                    <button onclick="ornekDurakDoldur('21000010')" 
                        class="text-xs text-blue-400 hover:text-blue-300 underline">
                        Leeuwarden Station (21000010)
                    </button>
                </div>
            </div>
        </div>

        <!-- Durum / Hata Mesajı -->
        <div id="statusMessage" class="hidden p-4 text-center text-xs font-mono break-all"></div>

        <!-- Otobüs Listesi -->
        <div id="busList" class="max-h-[420px] overflow-y-auto p-4 space-y-2">
            <div class="text-center text-slate-500 text-sm py-8">
                Yukarıdaki alana durak kodunu gir veya test için butona tıkla.
            </div>
        </div>
        
    </div>

    <script>
        function ornekDurakDoldur(kod) {
            document.getElementById('stopCodeInput').value = kod;
            verileriGetir();
        }

        function formatSaat(tarihString) {
            if (!tarihString) return "--:--";
            const date = new Date(tarihString);
            return date.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        }

        // CORS Engelini Aşmak İçin Yenilenmiş Çoklu Proxy Sistemi
        async function fetchWithFallback(durakKodu) {
            const targetUrl = `http://v0.ovapi.nl/tpc/${durakKodu}`;
            
            // Proxy 1: CodeTabs (Şu an en stabil ücretsiz CORS bypass)
            try {
                const p1 = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`;
                const res = await fetch(p1);
                if (res.ok) return await res.json();
            } catch (e) {
                console.warn("Proxy 1 (CodeTabs) başarısız...");
            }

            // Proxy 2: AllOrigins GET (Raw yerine JSON formatında çekip parse ediyoruz, timeout'a düşmez)
            try {
                const p2 = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                const res = await fetch(p2);
                if (res.ok) {
                    const data = await res.json();
                    return JSON.parse(data.contents); 
                }
            } catch (e) {
                console.warn("Proxy 2 (AllOrigins) başarısız...");
            }

            // Proxy 3: ThingProxy (Yedek)
            try {
                const p3 = `https://thingproxy.freeboard.io/fetch/${targetUrl}`;
                const res = await fetch(p3);
                if (res.ok) return await res.json();
            } catch (e) {
                console.warn("Proxy 3 (ThingProxy) başarısız...");
            }

            // 4. Doğrudan (Eğer tarayıcıda CORS eklentisi kuruluysa çalışır)
            const direct = await fetch(targetUrl);
            return await direct.json();
        }

        async function verileriGetir() {
            const inputElement = document.getElementById('stopCodeInput');
            const busListElement = document.getElementById('busList');
            
            const durakKodu = inputElement.value.trim();

            if (!durakKodu) {
                gosterDurum('Lütfen bir durak kodu girin.', 'text-yellow-400 bg-yellow-950/30');
                return;
            }

            busListElement.innerHTML = '';
            gosterDurum('Canlı veriler çekiliyor...', 'text-blue-400 animate-pulse bg-blue-950/30');

            try {
                const data = await fetchWithFallback(durakKodu);

                const durakVerisi = data[durakKodu];

                if (!durakVerisi || !durakVerisi.Passes || Object.keys(durakVerisi.Passes).length === 0) {
                    gosterDurum(`"${durakKodu}" kodlu durakta şu an beklenen otobüs yok.`, 'text-slate-400 bg-slate-800');
                    return;
                }

                const otobusler = Object.values(durakVerisi.Passes).sort((a, b) => 
                    new Date(a.ExpectedArrivalTime || a.TargetArrivalTime) - new Date(b.ExpectedArrivalTime || b.TargetArrivalTime)
                );

                gizleDurum();
                otobusleriEkranaCiz(otobusler, busListElement);

            } catch (error) {
                console.error("Detaylı API Hatası:", error);
                gosterDurum(`Sunucuya bağlanılamadı. Kodu doğru yazdığına emin ol veya tarayıcına 'CORS Unblock' eklentisi kur.`, 'text-red-400 bg-red-950/40 border border-red-800/50');
            }
        }

        function otobusleriEkranaCiz(otobusler, container) {
            container.innerHTML = '';

            otobusler.forEach(bus => {
                const hatNumarasi = bus.LinePublicNumber || '-';
                const hedef = bus.DestinationName50 || 'Bilinmiyor';
                const planlananSaat = bus.TargetArrivalTime;
                const gercekSaat = bus.ExpectedArrivalTime || planlananSaat;
                
                const gecikmeVarMi = planlananSaat && gercekSaat && planlananSaat !== gercekSaat;
                const saatClass = gecikmeVarMi ? 'text-rose-400' : 'text-emerald-400';
                const gecikmeMetni = gecikmeVarMi ? `<span class="text-xs text-slate-500 line-through mr-1">${formatSaat(planlananSaat)}</span>` : '';

                const cardHTML = `
                    <div class="flex items-center justify-between p-3.5 bg-slate-700/30 rounded-xl hover:bg-slate-700/50 transition-colors border border-slate-700/60">
                        <div class="flex items-center gap-3">
                            <div class="flex items-center justify-center w-11 h-11 bg-blue-600 text-white font-bold text-base rounded-lg shadow-sm">
                                ${hatNumarasi}
                            </div>
                            <div>
                                <h3 class="text-white font-medium text-sm leading-snug">${hedef}</h3>
                                <p class="text-xs text-slate-400 mt-0.5">Arriva</p>
                            </div>
                        </div>
                        
                        <div class="text-right">
                            <div class="text-base font-semibold ${saatClass} tracking-wide">
                                ${gecikmeMetni}${formatSaat(gercekSaat)}
                            </div>
                            <div class="text-[10px] ${gecikmeVarMi ? 'text-rose-400/80' : 'text-emerald-400/80'} font-medium mt-0.5">
                                ${gecikmeVarMi ? 'Gecikmeli' : 'Zamanında'}
                            </div>
                        </div>
                    </div>
                `;
                
                container.innerHTML += cardHTML;
            });
        }

        function gosterDurum(mesaj, stil) {
            const statusElement = document.getElementById('statusMessage');
            statusElement.className = `p-3 rounded-lg mx-4 mt-3 text-center text-xs font-mono break-all ${stil}`;
            statusElement.textContent = mesaj;
            statusElement.classList.remove('hidden');
        }

        function gizleDurum() {
            document.getElementById('statusMessage').classList.add('hidden');
        }
    </script>
</body>
</html>
