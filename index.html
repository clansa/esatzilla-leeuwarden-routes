<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hollanda Canlı Otobüs Saatleri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col max-h-[90vh]">
        
        <!-- Header -->
        <div class="p-6 border-b border-slate-700 bg-slate-800/50 shrink-0">
            <h1 class="text-2xl font-bold text-white tracking-tight">Durak Takibi</h1>
            <p class="text-sm text-slate-400 mt-1">Leeuwarden & Tüm Hollanda</p>
            
            <div class="mt-4 space-y-3">
                <input type="text" id="searchInput" placeholder="Durak kodu veya Yer (Örn: Leeuwarden)" 
                    class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm placeholder:text-slate-500">
                
                <div class="flex gap-2">
                    <button onclick="saatleriGetir()" 
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-3 py-2.5 rounded-lg font-medium transition-colors text-sm shadow-lg">
                        Mavi: Kodu Getir
                    </button>
                    <button onclick="durakAra()" 
                        class="flex-1 bg-slate-700 hover:bg-slate-600 text-white px-3 py-2.5 rounded-lg font-medium transition-colors text-sm shadow-lg border border-slate-600">
                        Gri: İsimden Bul
                    </button>
                </div>
                
                <div class="flex justify-end mt-1">
                    <button onclick="koduSecVeGetir('50006541')" 
                        class="text-[11px] text-emerald-400 hover:text-emerald-300 underline font-medium">
                        Çalışan Örnek Kod İle Test Et
                    </button>
                </div>
            </div>
        </div>

        <div id="statusMessage" class="hidden p-4 text-center text-xs font-medium shrink-0"></div>

        <div id="contentList" class="overflow-y-auto p-4 space-y-2 flex-1">
            <div class="text-center text-slate-500 text-sm py-6 px-4 leading-relaxed">
                <p class="mb-3"><span class="text-white font-medium">1. YÖNTEM:</span> Kutuya "Leeuwarden" yazıp <span class="text-slate-300">Gri Butona</span> bas. Etraftaki durakları kodlarıyla bulsun.</p>
                <p><span class="text-white font-medium">2. YÖNTEM:</span> Arkadaşının durak kodunu öğren, kutuya yazıp <span class="text-blue-400">Mavi Butona</span> bas, direkt saatler gelsin.</p>
            </div>
        </div>
        
    </div>

    <script>
        function formatSaat(tarihString) {
            if (!tarihString) return "--:--";
            const date = new Date(tarihString);
            return date.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        }

        // GRİ BUTON İŞLEVİ (İSİM -> KOORDİNAT -> DURAK KODU)
        async function durakAra() {
            const query = document.getElementById('searchInput').value.trim();
            const contentElement = document.getElementById('contentList');
            
            // Eğer kullanıcı sadece rakam girdiyse ve griye bastıysa uyar
            if (/^\d+$/.test(query)) {
                gosterDurum('Rakam girdiniz. Saatleri görmek için Lütfen MAVİ butona (Kodu Getir) basın.', 'text-yellow-400 bg-yellow-950/30');
                return;
            }

            if (query.length < 2) {
                gosterDurum('Lütfen geçerli bir şehir veya sokak adı girin.', 'text-yellow-400 bg-yellow-950/30');
                return;
            }

            contentElement.innerHTML = '';
            gosterDurum('Bölge aranıyor ve etraftaki duraklar taranıyor...', 'text-slate-300 animate-pulse bg-slate-700/50');

            try {
                // 1. Nominatim ile aranan yerin koordinatlarını çek
                const geoUrl = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=nl&q=${encodeURIComponent(query)}&limit=1`;
                const geoRes = await fetch(geoUrl);
                const geoData = await geoRes.json();

                if (!geoData || geoData.length === 0) {
                    gosterDurum(`"${query}" Hollanda sınırları içinde bulunamadı.`, 'text-yellow-400 bg-yellow-950/30');
                    return;
                }

                const lat = parseFloat(geoData[0].lat).toFixed(4);
                const lon = parseFloat(geoData[0].lon).toFixed(4);

                // 2. Koordinatın etrafındaki (2000m) durakları OVapi'den çek (HTTPS!)
                const ovUrl = `https://v0.ovapi.nl/api/nearby/${lat}/${lon}/2000`;
                const ovRes = await fetch(ovUrl);
                
                if (!ovRes.ok) throw new Error(`OVapi yakındaki durak servisi hata döndürdü (HTTP ${ovRes.status}). Servis şu an kesinti yaşıyor olabilir.`);
                const ovData = await ovRes.json();

                const duraklar = Object.values(ovData);

                if (duraklar.length === 0) {
                    gosterDurum(`"${query}" çevresinde aktif otobüs durağı bulunamadı.`, 'text-yellow-400 bg-yellow-950/30');
                    return;
                }

                gizleDurum();

                let html = `<div class="text-xs text-slate-400 mb-3 font-medium uppercase tracking-wider">Bulunan Duraklar (${geoData[0].display_name.split(',')[0]}):</div>`;
                
                duraklar.slice(0, 20).forEach(durak => {
                    const kod = durak.TimingPointCode;
                    const isim = durak.TimingPointName || 'İsimsiz Durak';
                    const sehir = durak.Town || '';
                    const mesafe = durak.Distance ? `${durak.Distance}m` : '';

                    html += `
                    <div onclick="koduSecVeGetir('${kod}')" class="cursor-pointer group flex items-center justify-between p-3.5 bg-slate-700/30 hover:bg-slate-700/80 rounded-xl mb-2 border border-slate-700/60 transition-all shadow-sm">
                        <div>
                            <div class="text-white font-medium text-sm group-hover:text-blue-400 transition-colors">${isim}</div>
                            <div class="text-xs text-slate-400 mt-1">${sehir} ${mesafe ? '• ' + mesafe : ''}</div>
                        </div>
                        <div class="text-xs bg-slate-800 text-slate-300 px-2 py-1 rounded border border-slate-600 font-mono">
                            Kod: ${kod}
                        </div>
                    </div>
                    `;
                });

                contentElement.innerHTML = html;

            } catch (error) {
                console.error("Arama Hatası:", error);
                gosterDurum(`Bağlantı hatası oluştu: ${error.message}`, 'text-red-400 bg-red-950/40 border border-red-800/50');
            }
        }

        // Listeden tıklanınca çalışır
        function koduSecVeGetir(kod) {
            document.getElementById('searchInput').value = kod;
            saatleriGetir(kod);
        }

        // MAVİ BUTON İŞLEVİ (KOD -> CANLI SAATLER)
        async function saatleriGetir(zorunluKod = null) {
            const contentElement = document.getElementById('contentList');
            const durakKodu = zorunluKod || document.getElementById('searchInput').value.trim();

            if (!durakKodu) {
                gosterDurum('Lütfen bir durak kodu girin.', 'text-yellow-400 bg-yellow-950/30');
                return;
            }

            contentElement.innerHTML = '';
            gosterDurum(`"${durakKodu}" durağı için canlı kalkışlar alınıyor...`, 'text-blue-400 animate-pulse bg-blue-950/30');

            try {
                // HTTPS!
                const response = await fetch(`https://v0.ovapi.nl/tpc/${durakKodu}`);
                
                if (response.status === 404) {
                    gosterDurum(`"${durakKodu}" kodlu durak sistemde bulunamadı. Eski/geçersiz bir kod olabilir.`, 'text-rose-400 bg-rose-950/30');
                    return;
                }

                if (!response.ok) throw new Error(`OVapi hata döndürdü (HTTP ${response.status}). Servis şu an kesinti yaşıyor olabilir.`);

                const data = await response.json();
                const durakVerisi = data[durakKodu];

                if (!durakVerisi || !durakVerisi.Passes || Object.keys(durakVerisi.Passes).length === 0) {
                    gosterDurum(`Bu duraktan planlanmış bir otobüs geçişi bulunmuyor.`, 'text-slate-400 bg-slate-800');
                    return;
                }

                const otobusler = Object.values(durakVerisi.Passes).sort((a, b) => 
                    new Date(a.ExpectedArrivalTime || a.TargetArrivalTime) - new Date(b.ExpectedArrivalTime || b.TargetArrivalTime)
                );

                gizleDurum();
                otobusleriEkranaCiz(otobusler, contentElement);

            } catch (error) {
                console.error("Saat Hatası:", error);
                gosterDurum(`Saat verisi alınamadı. Hata: ${error.message}`, 'text-red-400 bg-red-950/40');
            }
        }

        function otobusleriEkranaCiz(otobusler, container) {
            let html = '<div class="text-xs text-slate-400 mb-3 font-medium uppercase tracking-wider">Kalkış Saatleri:</div>';

            otobusler.forEach(bus => {
                const hat = bus.LinePublicNumber || '-';
                const hedef = bus.DestinationName50 || 'Bilinmiyor';
                const plan = bus.TargetArrivalTime;
                const gercek = bus.ExpectedArrivalTime || plan;
                
                const gecikmeli = plan && gercek && plan !== gercek;
                const saatClass = gecikmeli ? 'text-rose-400' : 'text-emerald-400';
                const gecikmeMetni = gecikmeli ? `<span class="text-xs text-slate-500 line-through mr-1">${formatSaat(plan)}</span>` : '';

                html += `
                    <div class="flex items-center justify-between p-3.5 bg-slate-700/30 rounded-xl hover:bg-slate-700/50 transition-colors border border-slate-700/60 mb-2">
                        <div class="flex items-center gap-3">
                            <div class="flex items-center justify-center w-11 h-11 bg-blue-600 text-white font-bold text-base rounded-lg shadow-sm">
                                ${hat}
                            </div>
                            <div>
                                <h3 class="text-white font-medium text-sm leading-snug">${hedef}</h3>
                                <p class="text-xs text-slate-400 mt-0.5">Arriva</p>
                            </div>
                        </div>
                        
                        <div class="text-right">
                            <div class="text-base font-semibold ${saatClass} tracking-wide">
                                ${gecikmeMetni}${formatSaat(gercek)}
                            </div>
                            <div class="text-[10px] ${gecmeliMi(plan, gercek)} font-medium mt-0.5">
                                ${gecikmeli ? 'Gecikmeli' : 'Zamanında'}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function gecmeliMi(plan, gercek) {
            return (plan && gercek && plan !== gercek) ? 'text-rose-400/80' : 'text-emerald-400/80';
        }

        function gosterDurum(mesaj, stil) {
            const el = document.getElementById('statusMessage');
            el.className = `p-3 rounded-lg mx-4 mt-3 mb-2 text-center text-xs font-medium break-all shadow-inner ${stil}`;
            el.textContent = mesaj;
            el.classList.remove('hidden');
        }

        function gizleDurum() {
            document.getElementById('statusMessage').classList.add('hidden');
        }
    </script>
</body>
</html>
